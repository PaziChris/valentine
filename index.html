<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <div class="card">
      <div class="emoji" aria-hidden="true">💘</div>

      <h1 id="question">moro mou willst du mein valentine sein?</h1>
      <p class="hint" id="hint">„Nein“ bist du schüchtern? 😈</p>

      <div class="buttons" id="buttons">
        <button id="yesBtn" class="btn btn-yes">Ja</button>
        <button id="noBtn" class="btn btn-no">Nein</button>
      </div>

      <div class="result hidden" id="result">
        <img id="yayImg" alt="Yay" src="yay.gif" />
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>

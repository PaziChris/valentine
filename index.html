<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Will you be my Valentine?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <div class="card" id="card">
      <div class="emoji" aria-hidden="true">🐱💗</div>

      <h1 id="question">Moro mou, willst du mein Valentine sein?</h1>

      <p class="hint" id="hint">„Nein“ bist du schüchtern? 😈</p>

      <div class="buttons" id="buttons">
        <button id="yesBtn" class="btn btn-yes">Ja</button>
        <button id="noBtn" class="btn btn-no">Nein</button>
      </div>

      <div class="result hidden" id="result">
        <h2>YAY! 🎉</h2>
        <img id="yayImg"
             alt="Yay"
             src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif" />
        <p class="small">Screenshot-proof 😄</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
